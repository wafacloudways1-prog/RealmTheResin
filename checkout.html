<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout | RealmTheResin</title>
<link rel="stylesheet" href="style.css">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head><body>
<header><div class="logo">RealmTheResin</div><a href="index.html">← Shop</a></header>
<main class="checkout">
<h1>Checkout</h1>
<div id="setupNotice" class="product" style="max-width:700px;margin:20px auto;text-align:left"></div>
<form id="form">
<input id="name" required placeholder="Full name">
<input id="phone" required placeholder="Phone number">
<textarea id="address" required placeholder="Full delivery address"></textarea>
<input id="city" required placeholder="City">
<input id="pin" required placeholder="PIN code">
<button class="primary" type="submit">Pay Securely</button>
</form>
<p id="msg"></p>
</main>
<script src="config.js"></script>
<script>
const notice = document.getElementById("setupNotice");
const form = document.getElementById("form");

if (!window.supabaseClient) {
  notice.innerHTML = "<h3>Preview mode</h3><p>Products and cart are ready. Supabase login and Razorpay payment will be connected after the preview is approved.</p>";
  form.addEventListener("submit", e => {
    e.preventDefault();
    document.getElementById("msg").textContent = "Payment is not configured yet.";
  });
} else {
  const client = window.supabaseClient;
  const cart = JSON.parse(localStorage.getItem("checkout_cart") || "[]");

  form.onsubmit = async e => {
    e.preventDefault();
    const { data: { session } } = await client.auth.getSession();
    if (!session) return alert("Please sign in first.");

    const items = cart.map(x => ({product_id:x.id,name:x.name,qty:x.qty,price:x.price}));
    const payload = {
      items,
      shipping: {
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        address: document.getElementById("address").value,
        city: document.getElementById("city").value,
        pin: document.getElementById("pin").value
      }
    };

    const {data,error} = await client.functions.invoke("create-razorpay-order",{body:payload});
    if (error || !data) {
      document.getElementById("msg").textContent = error?.message || "Could not create payment.";
      return;
    }

    const r = new Razorpay({
      key:data.key,
      amount:data.amount,
      currency:"INR",
      name:"RealmTheResin",
      description:"Handmade resin art",
      order_id:data.order_id,
      prefill:{name:payload.shipping.name,contact:payload.shipping.phone},
      handler: async function (response) {
        const v = await client.functions.invoke("verify-razorpay-payment", {
          body:{
            razorpay_order_id:response.razorpay_order_id,
            razorpay_payment_id:response.razorpay_payment_id,
            razorpay_signature:response.razorpay_signature
          }
        });
        if (v.error) {
          document.getElementById("msg").textContent = "Payment completed but verification failed.";
          return;
        }
        localStorage.removeItem("checkout_cart");
        location.href="orders.html";
      }
    });

    r.on("payment.failed", () => {
      document.getElementById("msg").textContent="Payment failed. Please try again.";
    });
    r.open();
  };
}
</script>
</body></html>
